# AndroidX is required by every dependency this app uses (Compose, Activity,
# Lifecycle, core-ktx). Without this flag AGP fails the build outright at
# checkDebugAarMetadata rather than warning.
android.useAndroidX=true

# The AGP 8 default, stated explicitly: each module gets only its own R class.
android.nonTransitiveRClass=true

# Applies to the whole build, Android or not. The default heap is tight for
# Kotlin compilation of the Compose sources.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

org.gradle.caching=true
kotlin.code.style=official
