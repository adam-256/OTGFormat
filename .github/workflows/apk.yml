name: Android APK

# Builds an installable debug APK.
#
# The development container this project is written in has no Android SDK and
# no route to Google's Maven repository, so the :android module cannot be
# compiled there. GitHub's runners have both. This workflow is therefore the
# only place the Android layer gets compiled, and its logs are the feedback
# loop for fixing it.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    # Needed to publish the APK as a release asset.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 requires JDK 17 or newer to run, independently of the Java 11
      # bytecode the modules target.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Report the SDK the runner provides
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "no platforms directory"

      - name: Install the platform and build tools this project needs
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Gradle's stack traces bury the one line that matters, and this log is
      # read remotely. The build output is kept and the actionable lines are
      # reprinted at the end, so a failure is legible from the tail alone.
      - name: Build the APK
        run: |
          set -o pipefail
          ./gradlew :android:assembleDebug --console=plain 2>&1 | tee build.log || true
          echo
          echo "======================= ERROR SUMMARY ======================="
          grep -nE "^e: |^w: |error:|FAILURE:|What went wrong|Caused by:|^> " build.log \
            | grep -v "org.gradle" | head -80 || echo "(no matching lines)"
          echo "============================================================="
          grep -q "BUILD SUCCESSFUL" build.log

      - name: Upload the APK as a build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OTGFormat-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # An Actions artifact downloads as a zip and requires a GitHub login,
      # which is awkward on the phone that is meant to install it. A release
      # asset on a public repository is a direct link to the .apk itself, so
      # installing it is: open link, tap file. The tag is reused, so the link
      # never changes.
      - name: Publish the APK where a phone can download it
        if: success() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find android/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" OTGFormat-debug.apk
          NOTES="Debug build of ${GITHUB_SHA::7}.

          Install: download the .apk below and tap it. Android will ask
          permission to install from this source, because it is a debug build
          rather than a Play Store release.

          Before formatting anything, plug in the drive, select it, and tap
          **Check this device**. That is read-only — it writes nothing — and
          produces a short report with Copy and Share buttons."
          gh release create latest-debug \
            --title "OTGFormat (latest debug build)" \
            --notes "$NOTES" \
            --prerelease 2>/dev/null || gh release edit latest-debug --notes "$NOTES"
          gh release upload latest-debug OTGFormat-debug.apk --clobber
          echo "Installable APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-debug/OTGFormat-debug.apk"
